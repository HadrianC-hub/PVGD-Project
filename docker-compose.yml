version: '3.8'

networks:
  hadoop_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-namenode
    hostname: hadoop-namenode
    environment:
      - CLUSTER_NAME=hadoop-cluster
      - CORE_CONF_hadoop_proxyuser_root_hosts=*
      - CORE_CONF_hadoop_proxyuser_root_groups=*
    ports:
      - "9870:9870" # HDFS Web UI
      - "8020:8020" # HDFS RPC Port
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./config:/opt/hadoop/etc/hadoop
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.10

  hadoop-resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-resourcemanager
    hostname: hadoop-resourcemanager
    environment:
      - CLUSTER_NAME=hadoop-cluster
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
      - YARN_CONF_yarn_resourcemanager_hostname=hadoop-resourcemanager
    ports:
      - "8088:8088" # YARN Web UI
    volumes:
      - ./config:/opt/hadoop/etc/hadoop
    depends_on:
      - hadoop-namenode
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.11

  hadoop-datanode-1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode-1
    hostname: hadoop-datanode-1
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
    depends_on:
      - hadoop-namenode
    volumes:
      - datanode_data_1:/hadoop/dfs/data
      - ./config:/opt/hadoop/etc/hadoop
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.12

  hadoop-datanode-2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode-2
    hostname: hadoop-datanode-2
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
    depends_on:
      - hadoop-namenode
    volumes:
      - datanode_data_2:/hadoop/dfs/data
      - ./config:/opt/hadoop/etc/hadoop
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.13

  hadoop-nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-nodemanager
    hostname: hadoop-nodemanager
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
      - YARN_CONF_yarn_resourcemanager_hostname=hadoop-resourcemanager
    depends_on:
      - hadoop-resourcemanager
      - hadoop-datanode-1 
      - hadoop-datanode-2 # Dependemos de ambos datanodes
    volumes:
      - ./config:/opt/hadoop/etc/hadoop
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.14

  spark-master:
    image: bde2020/spark-master:3.0.0-hadoop3.2
    container_name: spark-master
    hostname: spark-master
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "8080:8080" # Spark Web UI
      - "7077:7077" # Spark RPC Port
    volumes:
      - ./config/log4j.properties:/opt/spark/conf/log4j.properties
    depends_on:
      - hadoop-namenode
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.15

  spark-worker-1:
    image: bde2020/spark-worker:3.0.0-hadoop3.2
    container_name: spark-worker-1
    hostname: spark-worker-1
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - ENABLE_INIT_DAEMON=false
      - SPARK_EXECUTOR_MEMORY=2G
    depends_on:
      - spark-master
    volumes:
      - ./config/log4j.properties:/opt/spark/conf/log4j.properties
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.16

  spark-worker-2:
    image: bde2020/spark-worker:3.0.0-hadoop3.2
    container_name: spark-worker-2
    hostname: spark-worker-2
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - ENABLE_INIT_DAEMON=false
      - SPARK_EXECUTOR_MEMORY=2G
    depends_on:
      - spark-master
    volumes:
      - ./config/log4j.properties:/opt/spark/conf/log4j.properties
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.17

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    hostname: hive-metastore
    user: root
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
      - HDFS_CONF_dfs_namenode_rpc-address=hadoop-namenode:8020
    depends_on:
      - hadoop-namenode
    ports:
      - "9083:9083" # Hive Metastore Thrift Port
    volumes:
      - ./config/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.20
    entrypoint: >
      bash -c "chown -R hive:hive /opt/hive /opt/hive/metastore_db 2>/dev/null || true; if [ -f /opt/hive/metastore_db/service.properties ]; then echo 'Metastore ya inicializado (service.properties encontrado)'; else if [ -d /opt/hive/metastore_db ] && [ -z \"$$(ls -A /opt/hive/metastore_db 2>/dev/null)\" ]; then echo 'Directorio metastore vacío: eliminando para permitir creación'; rm -rf /opt/hive/metastore_db; fi; echo 'Inicializando metastore Derby...'; /opt/hive/bin/schematool -dbType derby -initSchema || true; fi; echo 'Arrancando Hive Metastore con logging DEBUG'; exec /opt/hive/bin/hive --service metastore -hiveconf hive.root.logger=DEBUG,console"

  data-producer:
    build:
      context: .
      dockerfile: Dockerfile.data-producer
    container_name: data-producer
    hostname: data-producer
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
      - HDFS_NAMENODE=hadoop-namenode:8020
      - HDFS_PATH=/data/input/
      - BATCH_INTERVAL=1
    depends_on:
      - hadoop-namenode
    volumes:
      - ./dataset:/dataset
      - ./producer:/producer
      - ./config:/opt/hadoop/etc/hadoop
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.18
    command: python3.7 /producer/producer.py

  spark-consumer:
    image: bde2020/spark-worker:3.0.0-hadoop3.2
    container_name: spark-consumer
    hostname: spark-consumer
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - ENABLE_INIT_DAEMON=false
      - SPARK_EXECUTOR_MEMORY=2G
      - SPARK_DRIVER_MEMORY=2G
    depends_on:
      - spark-master
      - hadoop-namenode
    volumes:
      - ./consumer:/consumer
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.19
    command: >
      sh -c "
        echo '=== INICIANDO SPARK CONSUMER SOLO PARQUET ===' &&
        cd /consumer &&
        python3 consumer.py
      "

  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit-app
    hostname: streamlit-app
    depends_on:
      - spark-master
      - hadoop-namenode
    ports:
      - "8501:8501"
    environment:
      - HADOOP_USER_NAME=root
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
      - HDFS_NAMENODE_RPC_ADDRESS=hadoop-namenode:8020
    volumes:
      - ./streamlit:/streamlit
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.21
    command: ["streamlit", "run", "/streamlit/app.py", "--server.address=0.0.0.0"]


volumes:
  namenode_data:
  datanode_data_1:
  datanode_data_2: